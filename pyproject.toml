# The uv workspace root for the client-server stack. A *virtual* root: it has no
# [project] table, so nothing here is built or installed of its own; it only
# ties the members together under ONE lockfile, uv.lock beside this file.
#
#   models/              pswamp-models    every message, one package per producer (pydantic only)
#   core/                pswamp-core      the server data architecture
#   modules/<name>/      pswamp-<name>    one project per analysis module, over the core
#   legacy/pswamp-wiring pswamp-wiring    TRANSITIONAL: the example sources
#   pipelines/           (not a project)  one pipeline file per app, pipelines/<app>.toml
#   tools/               pswamp-tools     the `pswamp` repo CLI (`uv run pswamp --help`)
#   app/server-python/   pswamp-server    the web backend, over all of them
#
# The desktop package (desktop/, p-swamp) is deliberately NOT a member: it keeps
# its own desktop/uv.lock, so its Qt/Kafka [full] extra never enters the
# server's resolution. The server reaches it as a plain editable path
# dependency (see app/server-python/pyproject.toml).
#
#   uv lock                                   re-resolve after editing any member's manifest
#   uv lock --upgrade-package p-swamp         ALSO needed after editing desktop/pyproject.toml
#   uv sync                                   every member plus the dev group, into ./.venv

[tool.uv.workspace]
# "modules/*": every module project, so a new module (`pswamp new module`) joins
# the workspace with no edit here.
members = ["models", "core", "modules/*", "legacy/pswamp-wiring", "tools", "app/server-python"]

# No [dependency-groups] here, on purpose. The dev tooling (ruff, pytest,
# pytest-asyncio) is the dev group of app/server-python/pyproject.toml. Because
# this root is virtual, `uv sync` / `uv run` here install every member together
# with its default (dev) group, and from app/server-python they install that
# member with its dev group; a dev group on the root would be dropped by the
# latter. So both directories get the same pinned linter and test runner.
#
# Deliberately no [tool.ruff] section: ruff treats a pyproject.toml as config
# only when one is present, and the explicit `--select F` in
# `pswamp check` is meant to stay authoritative.
