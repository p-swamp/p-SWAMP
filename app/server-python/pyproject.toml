# Dependency manifest for the Python state server — the single source of truth
# for what this deployable depends on. Mirrors app/client-web/package.json on the
# other half of the repo: this file states intent (compatible version ranges),
# and the committed uv.lock at the repo root (the workspace lock) pins the exact
# resolved versions of the full transitive closure, with hashes.
#
# Add or change a dependency by editing this file, then run `uv lock` (anywhere
# in the workspace) and commit both files together.

[project]
name = "pswamp-server"
version = "0.1.0"
description = "P-SWAMP state server: WebSocket backend for the web client."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "uvicorn[standard]>=0.52.4,<0.53",
    "p-swamp",
    # The server data architecture (core/). The extras bring the Kafka transport
    # and the remote data client.
    "pswamp-core[kafka,remote-data]",
    # The modules, their pipelines and the example sources (modules/).
    "pswamp-modules",
]

# p-swamp is the desktop package in desktop/ (desktop/pyproject.toml,
# desktop/src/pswamp/). It supplies the PMU decoding, the time-window storage and
# the monitoring applications this server is a front end for, and the code under
# src/pswamp_web/ is written so it could fold into it as src/pswamp/web/.
#
# It is NOT a workspace member: it keeps its own desktop/uv.lock, and reaches
# this workspace only through this one path dependency. Everywhere else in
# AGENTS.md still holds: nothing under desktop/src/pswamp/ imports pswamp_web.
# The dependency points one way only, web → desktop.
#
# Editable, so an edit to desktop/src/pswamp/ is live here with no reinstall.
#
# Deliberately no extras. p-swamp's [full] extra is what carries PySide6,
# pyqtgraph, kafka, nqkafka and tops-rt; none of that belongs in a headless
# server image, and the base dependency set (numpy, scipy, pandas) is all the
# analysis core needs.
#
# The path is relative to this file's directory: app/server-python/ → desktop/.
# It is deliberately the same string on the host and inside the image, which is
# why the image mirrors the repo at its real depth rather than flattening the
# server to /app — see the workspace note at the top of the runtime stage in the
# Dockerfile. After editing desktop/pyproject.toml, run
# `uv lock --upgrade-package p-swamp` at the repo root.
[tool.uv.sources]
p-swamp = { path = "../../desktop", editable = true }
# The shared core at core/ and the modules at modules/ are members of the uv
# workspace rooted at the repo root (one uv.lock there). Same one-way rule:
# nothing under core/ or modules/ imports from app/.
pswamp-core = { workspace = true }
pswamp-modules = { workspace = true }

# Tooling that must never ship in the image — the Dockerfile exports with
# --no-dev. Declared here so the versions are locked (in the workspace uv.lock)
# and hash-verified like everything else, and defined in exactly one place rather
# than duplicated across the scripts that invoke them. ruff is pinned exactly so
# everyone runs the identical linter; pytest drives the server, core and modules
# unit tests. It lives on this member rather than on the virtual workspace root
# because a root group is not installed by `uv sync`/`uv run` from this
# directory, while a member's dev group is installed from both (see the root
# pyproject.toml).
[dependency-groups]
dev = [
    "ruff==0.16.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

# Not an installable package: src/ is a plain source folder that the process runs
# from, not a packaging layout. src/server.py is the one entrypoint and imports
# each app package by name (`import pmu_test_streamer`), which resolves because
# the working directory is src/ — locally via `uv run src/server.py`, and in the
# image via WORKDIR /app/src. Inside an app package the modules use relative
# imports (pmu_test_streamer/api.py does `from .model import ...`), so a package
# can be moved or renamed without touching its internals. uv manages the
# dependencies and the venv only — it builds no wheel — so adding a backend api
# is just a new folder under src/, with no manifest change.
#
# Deliberately no [tool.ruff] section: ruff treats a pyproject.toml as config only
# when one is present, and the explicit `--select F` in scripts/error_check.sh is
# meant to stay authoritative (see the note there about not inheriting ruff's
# opinionated defaults).
[tool.uv]
package = false

# Unit tests live in tests/ and import the server packages under src/ by name
# (`from pswamp_web...`), so put src/ on sys.path the same way the running server
# does — its working directory is src/. asyncio_mode = "auto" lets the async
# registry tests run without a per-test marker. This section does not make ruff
# treat the file as config; only a [tool.ruff] section would, and there
# deliberately isn't one (see the note above).
[tool.pytest.ini_options]
# core/examples holds the remote data stub, which the tests run in-process.
pythonpath = ["src", "../../core/examples"]
# core/tests and the modules' tests run here too: one runner and one CI job
# cover all three suites. Each module carries its tests in a tests/ package
# beside its code, so those are found under modules/. Test file names must
# be unique across tests/ and core/tests, which are not packages.
testpaths = ["tests", "../../core/tests", "../../modules"]
asyncio_mode = "auto"
