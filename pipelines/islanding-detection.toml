# The Islanding detection pipeline: the islanding-detection.* topics, the configured sources,
# and the module. Loaded by the app's web API and by the module-worker
# (PSWAMP_WORKER_PIPELINES=...,islanding-detection.toml).
#
# By default the only source is the synthetic live feed: one shared run
# feeds the module, and every page shows its results from the start.
# ISLANDING_DETECTION_SOURCES, when set (name:entry-point,...), replaces the sources.

app = "islanding-detection"
modules = ["islanding-detection"]

[[sources]]
name = "live"
module = "rtsim-from-cim"
