# pswamp-wiring: TRANSITIONAL. The example data sources that used to sit beside
# the modules in modules/pswamp_modules/. They are not module code, so they are
# not in modules/; they live here only until the refactoring replaces them:
#
#   src/pswamp_modules/sources/     -> source modules, modules/sample-replay/ and
#                                      modules/live-synthetic/ (step 7)
#
# (The pipeline declarations that were here are now data: pipelines/<app>.toml
# at the repo root.)
#
# A portion of the pswamp_modules namespace, so its import path is unchanged:
# <APP>_DATA_CLIENTS=...:pswamp_modules.sources.sample_client:... and the
# pipeline files' [[sources]] still name it. See README.md.
#
# A member of the uv workspace rooted at the repo root (one uv.lock there). It
# depends on the core and the models only.

[project]
name = "pswamp-wiring"
version = "0.1.0"
description = "Transitional: the example data sources, until sources become modules."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pswamp-core",
    "pswamp-models",
]

[tool.uv.sources]
pswamp-core = { workspace = true }
pswamp-models = { workspace = true }

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

# A namespace portion of pswamp_modules, and no src/pswamp_modules/__init__.py.
[tool.uv.build-backend]
module-name = "pswamp_modules.sources"

# No [tool.ruff] section: `pswamp check` passes `--select F` explicitly.

# Used when pytest is pointed at this folder; `uv run pswamp test server` runs
# these tests too, with the server's config. core/examples holds the remote
# data stub, which the sources' tests run in-process.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../../core/examples"]
asyncio_mode = "auto"
