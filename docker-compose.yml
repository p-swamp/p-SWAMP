# The deployment's transport. The server and every worker read the same
# variables, so the two sides cannot be configured apart. Unset (a bare
# `docker run`), the transport is in-memory and the server hosts every module.
x-transport: &transport
  PSWAMP_TRANSPORT: "kafka:pswamp_core.transport.kafka:KafkaTransport"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

# The streamer's sources: the in-image recording, the synthetic live feed, and
# the same recording from the remote data service below. Whoever reads the
# gateway (the server, and the worker hosting the range summary) gets these.
x-streamer-sources: &streamer-sources
  PMU_TEST_STREAMER_DATA_CLIENTS: "sample:pmu_test_streamer.sample_client:SampleRecordingClient,live:pmu_test_streamer.live_client:LiveSyntheticClient,remote:pswamp_core.datagateway.clients.remote_data:RemoteDataClient"
  REMOTE_URL: "http://remote-data-stub:8100"

services:
  # Just "server": Compose prefixes containers with the project name, which is
  # already the repo directory (p-SWAMP), so this comes up as p-swamp-server-1
  # rather than repeating the name twice.
  server:
    build: .
    image: p-swamp:latest
    ports:
      - "8000:8000"
    environment:
      <<: [*transport, *streamer-sources]
      HOST: "0.0.0.0"
      PORT: "8000"
      # Compose sync writes may not always emit inotify events in-container;
      # polling keeps reload reliable across host/container boundaries.
      WATCHFILES_FORCE_POLLING: "true"
    # Dev-only override: run uvicorn with --reload so the files synced in by
    # `watch` (below) trigger an in-process hot reload. The Dockerfile's prod
    # CMD (plain `python server.py`) is left untouched — this reloader never
    # ships, since compose is only used locally during dev.
    command:
      [
        "uvicorn",
        "server:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/workspace/p-SWAMP/app/server-python/src",
        "--reload-dir",
        "/workspace/p-SWAMP/src",
        "--reload-dir",
        "/workspace/p-SWAMP/core/src",
      ]
    # The server has no external dependencies, so "is the process serving?" is
    # the whole health story — /healthz covers it. curl returns non-zero if the
    # endpoint doesn't answer.
    depends_on:
      kafka:
        condition: service_healthy
      remote-data-stub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    # Live reload for dev, the server-side analog of the client's `entr -r`:
    # run `docker compose watch`, and on a save Compose copies the file into the
    # running container. No rebuild and no container restart — uvicorn's own
    # --reload watcher (see the command: override above) sees the new file and
    # hot-reloads the app in place. Pure `sync` works *because* of that watcher;
    # without it the file would land but the old code would keep running.
    develop:
      watch:
        # The whole source dir, not a file-by-file list: a new module — or a
        # whole new app package under src/ — is picked up without editing this
        # file. The image mirrors the repo
        # (the whole repo at /workspace/p-SWAMP, at its real depth — see the
        # Dockerfile), so the two sides of this path match.
        # .dockerignore applies here too, so __pycache__/ and a locally built
        # src/static/ are not synced in — importantly, the web client baked into
        # the image at <server dir>/src/static keeps being served during a watch
        # session.
        # Adds and edits propagate; a local *delete* does not (the file lingers
        # in the container until the next rebuild).
        - path: app/server-python/src
          action: sync
          target: /workspace/p-SWAMP/app/server-python/src
        # The same live-reload loop for the desktop package at the repo root.
        # p-swamp is installed editable (see the Dockerfile), so root src/pswamp/
        # in the image is what actually gets imported, and syncing it means a
        # change to a monitoring application or the time-window storage
        # hot-reloads here just like a change to the server's own code. Without
        # this, edits there would appear to do nothing until the next rebuild.
        - path: src
          action: sync
          target: /workspace/p-SWAMP/src
        # The shared core, installed editable in the image like root src/.
        - path: core/src
          action: sync
          target: /workspace/p-SWAMP/core/src
        # Dependency changes are the exception: new packages have to be
        # installed, which a file sync can't do. These rebuild the image and
        # recreate the container instead — slower, on purpose. Without this,
        # editing pyproject.toml would appear to do nothing.
        - path: app/server-python/pyproject.toml
          action: rebuild
        - path: app/server-python/uv.lock
          action: rebuild
        - path: core/pyproject.toml
          action: rebuild

  # Hosts the pipelines' modules, off Kafka: the same image (the second
  # `build: .` is a cache hit), running pswamp_core.worker instead of the
  # server. A plain process with no reloader, so compose watch restarts it.
  module-worker:
    build: .
    image: p-swamp:latest
    command: ["python", "-m", "pswamp_core.worker"]
    environment:
      <<: *transport
      PSWAMP_WORKER_PIPELINES: "pmu_test_streamer.pipeline:PIPELINE"
      PSWAMP_WORKER_MODULES: "frame-stats,excursion"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    develop: &worker-watch
      watch:
        - path: app/server-python/src
          action: sync+restart
          target: /workspace/p-SWAMP/app/server-python/src
        - path: core/src
          action: sync+restart
          target: /workspace/p-SWAMP/core/src
        - path: core/pyproject.toml
          action: rebuild

  # The range summary in a worker of its own: a batch query over a recording,
  # with its own CPU budget, so a heavy one cannot slow the frame-rate modules.
  # It reads the recording itself, so it needs the same <APP>_DATA_CLIENTS as
  # the server (here the in-image defaults).
  batch-worker:
    build: .
    image: p-swamp:latest
    command: ["python", "-m", "pswamp_core.worker"]
    environment:
      <<: [*transport, *streamer-sources]
      PSWAMP_WORKER_PIPELINES: "pmu_test_streamer.pipeline:PIPELINE"
      PSWAMP_WORKER_MODULES: "range-summary"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    cpus: 1.0
    develop: *worker-watch

  # A dummy remote data service (core/examples/remote_data_stub): the sample
  # recording served over the remote data contract, standing where a
  # deployment's own service in front of its store would. Same image; the
  # server's src/ is its working directory, so the sample client imports.
  remote-data-stub:
    build: .
    image: p-swamp:latest
    command: ["python", "-m", "remote_data_stub"]
    environment:
      PYTHONPATH: "/workspace/p-SWAMP/core/examples"
      REMOTE_DATA_STUB_CLIENT: "sample:pmu_test_streamer.sample_client:SampleRecordingClient"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8100/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # The broker for PSWAMP_TRANSPORT=kafka: Apache Kafka's own image (Apache
  # 2.0), one node in KRaft mode. No volume: every topic is a live hop, and a
  # restart empties them at no cost. Topic auto-creation is off, because the
  # transport creates its topics itself (one partition, bounded retention).
  # Port 19092 is for the host: the transport tests and any Kafka CLI.
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      # Apply the transport's one-minute topic retention every 10 s, not every
      # five minutes (the default), which at replay speed fills the disk.
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: "10000"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "19092:19092"
    # Answers only once the broker is serving.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s
    restart: unless-stopped
