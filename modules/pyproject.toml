# pswamp-modules: the analysis modules over the server data architecture, the
# pipelines that put them together, and the example data sources. See
# doc/server-data-architecture.md and doc/module-cookbook.md.
#
# The fourth Python project in the repo. The layering runs one way:
#
#   models/   pswamp-models    depends on pydantic only
#   core/     pswamp-core      depends on pswamp-models
#   modules/  pswamp-modules   depends on pswamp-core and pswamp-models
#   app/server-python          depends on both
#
# So a worker hosting modules imports models, core and modules, and no web backend.
# It is a member of the uv workspace rooted at the repo root, locked in the one
# uv.lock there, and its tests run with the web backend's, so there is no
# lockfile here. A module's own third-party dependency goes in `dependencies` below.

[project]
name = "pswamp-modules"
version = "0.1.0"
description = "p-SWAMP analysis modules, their pipelines and example data sources, over pswamp-core."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pswamp-core", "pswamp-models"]

[tool.uv.sources]
pswamp-core = { workspace = true }
pswamp-models = { workspace = true }

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

# Flat layout: the package sits directly in this folder, with no src/ level
# (unlike core/), so a module is modules/pswamp_modules/<module>/.
[tool.uv.build-backend]
module-name = "pswamp_modules"
module-root = ""

# No [tool.ruff] section: `pswamp check` passes `--select F` explicitly.

# Each module carries its tests in a tests/ package beside its code, so they
# are found under pswamp_modules/. Used when pytest is pointed at this folder directly; the
# usual runner is `uv run pswamp test server`, which takes the server's
# config. core/examples holds the remote data stub, which the sources' tests
# run in-process.
[tool.pytest.ini_options]
testpaths = ["pswamp_modules"]
pythonpath = ["../core/examples"]
asyncio_mode = "auto"
