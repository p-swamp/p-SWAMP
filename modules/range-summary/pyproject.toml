# pswamp-range-summary: the range summary module (range-summary): a batch query over a recorded range.
# One module, one project: its code (src/), its tests (tests/), a README and
# runnable examples (examples/), and nothing else. See modules/README.md.
#
# A member of the uv workspace rooted at the repo root (one uv.lock there). It
# depends on pswamp-core and pswamp-models and nothing else in this repo; it
# never imports the web backend or the desktop package
# (tools/tests/test_tools_layering.py checks both).
#
# The package is a portion of the pswamp_modules namespace (PEP 420): there is
# deliberately no src/pswamp_modules/__init__.py, so every module project adds
# its own pswamp_modules.<name> and they all import side by side.

[project]
name = "pswamp-range-summary"
version = "0.1.0"
description = "The range summary module (range-summary): a batch query over a recorded range."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pswamp-core", "pswamp-models"]

# How a pipeline finds the module by name: the entry point's name is the
# module's `name` (its app identity, and what PSWAMP_WORKER_MODULES lists).
[project.entry-points."pswamp.modules"]
range-summary = "pswamp_modules.range_summary:RangeSummaryModule"

[tool.uv.sources]
pswamp-core = { workspace = true }
pswamp-models = { workspace = true }

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

# A dotted module-name: uv_build builds the namespace portion
# src/pswamp_modules/range_summary/ and requires no src/pswamp_modules/__init__.py.
[tool.uv.build-backend]
module-name = "pswamp_modules.range_summary"

# No [tool.ruff] section: `pswamp check` passes `--select F` explicitly.

# Used by `uv run pswamp test module range-summary`; `uv run pswamp test server` runs
# these tests too, with the server's config.
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
