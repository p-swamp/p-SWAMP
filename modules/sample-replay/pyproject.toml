# pswamp-sample-replay: the sample replay source (sample-replay): the bundled Nordic 44 sample recording, replayable.
# One module, one project: its code (src/), its tests (tests/), a README and
# runnable examples (examples/), and nothing else. See modules/README.md.
#
# A member of the uv workspace rooted at the repo root (one uv.lock there). It
# depends on pswamp-core and pswamp-models and nothing else in this repo; it
# never imports the web backend or the desktop package
# (tools/tests/test_tools_layering.py checks both).
#
# The package is a portion of the pswamp_modules namespace (PEP 420): there is
# deliberately no src/pswamp_modules/__init__.py, so every module project adds
# its own pswamp_modules.<name> and they all import side by side. The data file
# sample_data.txt is under src/, beside the code that reads it.

[project]
name = "pswamp-sample-replay"
version = "0.1.0"
description = "The sample replay source (sample-replay): the bundled Nordic 44 sample recording, replayable."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pswamp-core", "pswamp-models"]

# Only for examples/, never the source itself (the image does not install it):
#   uv run --package pswamp-sample-replay --extra examples python modules/sample-replay/examples/replay_stats.py
# The example feeds the replayed frames to the frame-stats module.
[project.optional-dependencies]
examples = ["pswamp-frame-stats", "matplotlib>=3.8"]

# How a pipeline finds the source by name: the entry point's name is the
# source's `name` (what a pipeline file's [[sources]] `module` says).
[project.entry-points."pswamp.modules"]
sample-replay = "pswamp_modules.sample_replay:SampleReplay"

[tool.uv.sources]
pswamp-core = { workspace = true }
pswamp-models = { workspace = true }
pswamp-frame-stats = { workspace = true }

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

# A dotted module-name: uv_build builds the namespace portion
# src/pswamp_modules/sample_replay/ and requires no src/pswamp_modules/__init__.py.
[tool.uv.build-backend]
module-name = "pswamp_modules.sample_replay"

# No [tool.ruff] section: `pswamp check` passes `--select F` explicitly.

# Used by `uv run pswamp test module sample-replay`; `uv run pswamp test server` runs
# these tests too, with the server's config.
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
