# Quality gates for pull requests. Publishes nothing — and neither does anything
# else in this repo: build-container.yml only checks that the image still builds
# on main. Downstream deployments build their own image from the Dockerfile.
#
# Four independent merge gates:
#   dependency-review — rejects unsafe dependency changes in this pull request
#   static-errorcheck — scripts/error_check.sh, the same gate .githooks/pre-push runs, and scripts/check-generators.sh
#   unit-tests        — the Python test suites via their runner scripts, the
#                       transport suite against a real Kafka broker included
#   e2e-smoke-test    — builds the image, runs it, drives the Reference example and the PMU test streamer
# The provisional playwright-e2e job is present too, but is not yet a required
# branch-protection check.

# Making these block a merge is a repo setting: Settings → Branches → protection
# for main → "Require status checks to pass", selecting the four JOB names above.
# Renaming a job here silently un-requires it there — rename both together.
#
# No paths filter on pull_request, on purpose: GitHub scores a required check
# that never ran as pending, so a PR outside the filter could never merge.
name: quality-checks

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Git ref to compare the selected branch against
        required: true
        default: main

# A new push to the same PR cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # Prerequisite: Settings > Advanced Security > Dependency Graph must be
      # enabled. GitHub parses npm locks directly and graphs uv locks through
      # its Dependabot graph job; this action consumes those snapshots.
      # A pull request supplies its own base and head revisions.
      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          config-file: ./.github/dependency-review-config.yml

      # After this workflow exists on the default branch, manual dispatch can
      # compare any branch selected in the Actions UI with base_ref.
      - name: Dependency Review (manual branch comparison)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/dependency-review-action@v5
        with:
          config-file: ./.github/dependency-review-config.yml
          base-ref: ${{ inputs.base_ref }}
          head-ref: ${{ github.ref }}

  static-errorcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # error_check.sh needs node, npx, uv and python3. Node 24 matches the
      # Dockerfile's web-build stage.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/client-web/package-lock.json

      # `uv`, not `uvx`: ruff comes from the locked dev dependency group.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: app/server-python/uv.lock

      # `uv lock --check` runs --offline and needs a real 3.14.8 (per
      # app/server-python/.python-version); the runner's own python3 won't do.
      - name: Install Python 3.14.8 for uv
        run: uv python install 3.14.8

      # Installs node_modules and syncs the server env itself (the api-contract
      # check imports the FastAPI app), so there is no separate install step.
      - name: Static checks (tsc, eslint, uv lock --check, py_compile, ruff, api contract)
        run: ./scripts/error_check.sh

      # Both generators, in a throwaway worktree: their output passes the same
      # checks and the generated module's tests.
      - name: The generators produce working apps
        run: ./scripts/check-generators.sh

  unit-tests:
    runs-on: ubuntu-latest
    # One Kafka node, as in docker-compose.yml, for the transport suite's Kafka
    # half (core/tests/test_kafka_transport.py), which is skipped without one.
    services:
      kafka:
        image: apache/kafka:4.3.1
        ports: ["9092:9092"]
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s --health-timeout 10s --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: app/server-python/uv.lock
      - run: uv python install 3.14.8

      # The server's, the core's and the modules' suites; hermetic but for the
      # Kafka half, which uses the service container above.
      - name: Server, core and modules unit tests
        env:
          KAFKA_TEST_BOOTSTRAP_SERVERS: localhost:9092
        run: ./scripts/run-python-server-tests.sh

      # TODO Re-enable once the desktop suite (repo-root tests/) collects again:
      # tests/test_run_simple_case_{kafka,nqkafka}.py import
      # pswamp.monitoring.utils.TimeWindowRTApp, removed in 15a3f7a. It also needs
      # Kafka/NQKafka/MQTT brokers and a Qt display, so the infra-bound tests
      # must be skip-guarded first.
      # - name: Core (desktop) unit tests
      #   run: ./scripts/run-core-python-tests.sh

  # error_check.sh never starts the app; this job only starts it. It runs the
  # image as a cluster would (the Dockerfile's own CMD, no compose dev overrides,
  # no broker: the in-memory transport) and drives the Reference example and the
  # PMU test streamer end to end. See scripts/e2e-smoke-test.sh.
  e2e-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # uv for the WebSocket half of the test, which runs in the server's locked
      # environment (websockets is already there via uvicorn[standard]).
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: app/server-python/uv.lock
      - run: uv python install 3.14.8

      # Shares the type=gha layer cache with build-container.yml, so this build
      # is mostly a cache hit. `load: true` puts the image in the runner's daemon.
      - uses: docker/setup-buildx-action@v4
      - name: Build the image under test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: p-swamp:smoketest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `docker run`, not `docker compose up`: compose overrides the command with
      # `uvicorn --reload` for local dev, which is not what ships.
      - name: Start the server
        run: |
          docker run -d --name p-swamp-smoketest \
            -p 8000:8000 -e HOST=0.0.0.0 -e PORT=8000 \
            p-swamp:smoketest

      # SMOKETEST_URL = test this server, don't manage its lifecycle. The script
      # waits for /healthz itself.
      - name: Smoke test the running image
        run: SMOKETEST_URL=http://127.0.0.1:8000 ./scripts/e2e-smoke-test.sh

      - name: Server log
        if: always()
        run: docker logs p-swamp-smoketest || true

      - name: Stop the server
        if: always()
        run: docker rm -f p-swamp-smoketest || true

  # --- Playwright end-to-end tests -------------------------------------------
  #
  # Playwright test suite. Will eventually replace the e2e-smoke-test job above.
  # Gated on the unit-tests job.
  #
  # Initial implementation for later development.
  #
  # Runs the app in a docker container as defined in playwright.config.ts.
  playwright-e2e:
    needs: [unit-tests, e2e-smoke-test]
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: e2e/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v5
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: e2e/playwright-report/
        retention-days: 30
