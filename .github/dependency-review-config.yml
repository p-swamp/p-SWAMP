# Dependency Review evaluates dependencies added or changed by a pull request.
# This list is grounded in doc/dependency-license-inventory.md and intentionally
# excludes the observed MPL, EPL, LGPL and GPL licenses pending explicit review.
fail-on-severity: high
fail-on-scopes:
  - runtime

vulnerability-check: true
license-check: true
allow-licenses:
  - 0BSD                         # permissive
  - Apache-2.0                   # permissive
  - BSD-2-Clause                 # permissive
  - BSD-2-Clause-Views           # permissive
  - BSD-3-Clause                 # permissive
  - BlueOak-1.0.0                # permissive
  - CC-BY-4.0                    # permissive
  - CC0-1.0                      # permissive
  - HPND-Markus-Kuhn             # permissive (used by pypy:wcwidth)
  - ISC                          # permissive
  - JSON                         # permissive (used by npm:json-schema-typed)
  - LicenseRef-scancode-matplotlib-1.3.0 # permissive
  - MIT                          # permissive
  - MIT-CMU                      # permissive
  - MPL-2.0                      # weak copyleft
  - OFL-1.1                      # permissive for embedding
  - PSF-2.0                      # permissive
  - Python-2.0                   # permissive
  - Zlib                         # permissive (used by pypy:numpy)

allow-dependencies-licenses:
  - pkg:pypi/typing-extensions   # licensed PSF-2.0 (same as CPython) but GitHub
                                 # (mistakenly?) lists other licenses for it.

# Results remain in the check log and job summary, so the workflow needs no
# pull-request write permission.
comment-summary-in-pr: never

# GitHub may still be generating a uv dependency snapshot when this job starts.
retry-on-snapshot-warnings: true
retry-on-snapshot-warnings-timeout: 120
